name: Build Evolution TV IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install webOS CLI
        run: |
          npm install -g @webosose/ares-cli@2.0.0

      - name: Verify CLI installation
        run: |
          npm list -g @webosose/ares-cli
          npm bin -g

      - name: Build IPK
        run: |
          ares-package .

      - name: List files
        run: |
          ls -la

      - name: Rename IPK
        run: |
          mv com.evolution555.evolutiontv_*.ipk evolution-tv.ipk || echo "No IPK to rename"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evolution-tv-ipk
          path: evolution-tv.ipk
          if-no-files-found: warn

      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: evolution-tv.ipk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
