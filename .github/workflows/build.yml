name: Build Evolution TV IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install webOS CLI
        run: |
          npm install -g @webosose/ares-cli

      - name: Verify CLI installation
        run: |
          which ares-package || echo "CLI not in PATH"
          npm list -g @webosose/ares-cli

      - name: Build IPK
        run: |
          ares-package . || echo "Build failed"

      - name: List files
        run: |
          ls -la *.ipk 2>/dev/null || echo "No IPK files found"

      - name: Rename IPK
        if: success()
        run: |
          mv com.evolution555.evolutiontv_*.ipk evolution-tv.ipk

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: evolution-tv-ipk
          path: evolution-tv.ipk

      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: evolution-tv.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
